<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photoshop 第一堂課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: artboard workspace — left panel = tool index (like Photoshop's tool panel), right = slides on a canvas */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#1d2523; --muted:#5f6d6a; --line:#dde3e1;
  --accent:#16807a; --accent-soft:#e2f1ef; --anchor:#c9612b;
  --canvas:#e8ecea; --shadow:0 1px 2px rgba(20,40,36,.08),0 6px 20px rgba(20,40,36,.07);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --side:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1b2221; --ink:#e6ecea; --muted:#9aa9a5; --line:#2c3634;
  --accent:#4fbcb3; --accent-soft:#1d3532; --anchor:#e98b55; --canvas:#101514;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1b2221; --ink:#e6ecea; --muted:#9aa9a5; --line:#2c3634;
  --accent:#4fbcb3; --accent-soft:#1d3532; --anchor:#e98b55; --canvas:#101514;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.brand b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.brand span{font-size:13px;color:var(--muted)}
.search{padding:12px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
nav{overflow-y:auto;padding:8px 10px 24px;flex:1;min-height:0}
.grp{margin-top:10px}
.grp-h{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px 4px;background:none;border:0;cursor:pointer;text-align:left}
.grp-h b{font-size:13px;font-weight:700;letter-spacing:.04em}
.grp-h small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:left;font-size:14px}
.item:hover{background:var(--bg)}
.item .dot{width:7px;height:7px;flex:none;border:1.5px solid var(--muted);background:var(--panel)}
.item .nm{flex:1;min-width:0}
.item kbd,.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.item[aria-current="true"] .dot{background:var(--accent);border-color:var(--accent)}
.item[hidden],.grp[hidden]{display:none}
.empty{padding:16px 12px;color:var(--muted);font-size:13px}

main{overflow-y:auto;min-height:0;background:var(--canvas)}
.wrap{max-width:1080px;margin:0 auto;padding-block:32px 64px;padding-inline:clamp(16px,3vw,40px)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(24px,3vw,32px);line-height:1.25;margin:4px 0 6px;text-wrap:balance;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.slides{display:flex;flex-direction:column;gap:28px;margin-top:24px}
figure{margin:0}
.frame{background:#fff;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;cursor:zoom-in;display:block;width:100%;border:0;padding:0}
.frame img{display:block;width:100%;height:auto;aspect-ratio:16/9}
figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
figcaption .pg{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pager button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;min-width:0}
.pager button:hover{border-color:var(--accent)}
.pager button.next{text-align:right}
.pager small{display:block;font-size:12px;color:var(--muted)}
.pager b{font-weight:500}
.pager button[disabled]{visibility:hidden}

/* Home */
.hero p{color:var(--muted);max-width:60ch;margin:6px 0 0}
.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--muted)}
.how span::before{content:"";display:inline-block;width:6px;height:6px;border:1.5px solid var(--anchor);margin-right:8px;vertical-align:middle}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.sec-h h2{font-size:18px;margin:0}
.sec-h small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#fff;border-bottom:1px solid var(--line)}
.card .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .ct{font-weight:500;font-size:14px;line-height:1.4}
.card .cm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}

.dl{margin-top:36px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.dl h2{font-size:16px;margin:0 0 12px}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dl-item{display:flex;gap:14px;align-items:flex-start;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.dl-item img{width:96px;height:96px;object-fit:cover;border-radius:6px;flex:none;background:#fff}
.dl-b{min-width:0;display:flex;flex-direction:column;gap:4px}
.dl-b p{margin:0;font-size:13px;color:var(--muted)}
.dl-b small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dl-btn{align-self:flex-start;margin-top:6px;background:var(--accent);color:var(--panel);text-decoration:none;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:500}
.dl-btn:hover{filter:brightness(1.08)}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.frame img{background:linear-gradient(90deg,#fff,#eef4f2,#fff)}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(10,14,13,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
.lb img{max-width:100%;max-height:100%;border-radius:4px;background:#fff}
.lb .bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#e6ecea;font-size:14px;gap:12px}
.lb button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
.lb .nav{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;display:flex;justify-content:center;gap:10px}

/* Mobile */
.topbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .topbar button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;flex:none}
  aside{position:fixed;inset:0;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  aside.open{transform:none}
  .close-side{display:block!important}
  .pager{grid-template-columns:1fr}
}
.close-side{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body style="margin:0">

<div class="app">
  <div class="topbar"><b id="tbTitle">Photoshop 第一堂課</b><button id="openSide" type="button">目錄</button></div>

</div>
<div class="lb" id="lb" hidden>

</div>

<script>
const PAGE_TITLES = [
"Photoshop 第一堂課","Photoshop 與 Illustrator 怎麼選？","今天的操作順序","今天的操作順序：01 建立文件","點陣影像：照片是由像素組成的",
"像素尺寸、PPI 與印刷尺寸","RGB 與 CMYK：光和油墨","工作區：先找到四個位置","工作區：左側工具列","工作區：上方選項列",
"工作區：右側面板","工作區：畫布與縮放","建立第一份文件","開啟與置入：兩種不同用途","操作 01：置入照片與第一次儲存",
"圖層：把不同內容分開放","整理圖層：讓自己看得懂","操作 02：複製、隱藏與改變順序","移動與自由變形","操作 03：照片縮放與移動",
"智慧型物件：保留來源資訊","裁切、影像尺寸、版面尺寸","選取範圍：指定這次要處理哪裡","選取工具：依形狀選擇","跟做：選取花朵主體",
"操作 04：從選取到去背","圖層遮色片：白顯示、黑隱藏","跟做：用筆刷修整遮色片","操作 05：修整花瓣邊緣","調整圖層：保留可修改的調色",
"操作 06：更換背景與局部調色","基本調色 ①：亮度與對比","基本調色 ②：色相與飽和度","文字工具：建立資訊層級","操作 07：標題、副標與姓名",
"儲存 PSD，再輸出圖片","操作 08：輸出 JPG 與透明 PNG","25 分鐘練習：FLOWER STUDY","常用快捷鍵｜Windows / Mac","回家作業公告：暖身練習 1",
"01 建立文件與置入素材","02 選取工具：先抓主體，再修範圍","03 建立遮色片與修整花瓣","04 油漆桶：建立白色背景","05 灰色剪影：用選取範圍填色",
"06 變形與複製：安排花影背景","07 文字與前後層次","08 繳交前檢查與輸出","回家作業規格：FLOWER STUDY 花卉文字海報"];
const GROUPS = [
 {id:"start", label:"開始", sub:"課程概覽", items:[
  {id:"intro", t:"課程概覽與操作順序", p:[1,2,3]},
 ]},
 {id:"g1", label:"01 建立文件", sub:"尺寸・色彩・工作區", items:[
  {id:"newdocui", t:"新增文件畫面", p:[4]},
  {id:"pixel", t:"像素與點陣影像", p:[5]},
  {id:"ppi", t:"像素尺寸、PPI 與印刷尺寸", p:[6]},
  {id:"rgb", t:"RGB 與 CMYK", p:[7]},
  {id:"workspace", t:"工作區四個位置", k:"Ctrl/Cmd+0", p:[8,9,10,11,12]},
  {id:"newdoc", t:"建立第一份文件", k:"Ctrl/Cmd+N", p:[13]},
  {id:"place", t:"開啟與置入", p:[14,15]},
 ]},
 {id:"g2", label:"02 編輯影像", sub:"圖層・變形・選取・遮色片・調色", items:[
  {id:"layers", t:"圖層與整理圖層", k:"Ctrl/Cmd+J", p:[16,17,18]},
  {id:"transform", t:"移動與自由變形", k:"V / Ctrl/Cmd+T", p:[19,20]},
  {id:"smart", t:"智慧型物件", p:[21]},
  {id:"crop", t:"裁切與影像尺寸", k:"C", p:[22]},
  {id:"selection", t:"選取範圍與選取工具", k:"M / L / W", p:[23,24]},
  {id:"subject", t:"選取主體與去背", p:[25,26]},
  {id:"mask", t:"圖層遮色片", k:"B / D / X", p:[27,28,29]},
  {id:"adjust", t:"調整圖層與換背景", p:[30,31]},
  {id:"brightness", t:"亮度與對比", p:[32]},
  {id:"hue", t:"色相與飽和度", p:[33]},
 ]},
 {id:"g3", label:"03 完成版面", sub:"文字・儲存・輸出", items:[
  {id:"type", t:"文字工具與標題排版", k:"T", p:[34,35]},
  {id:"export", t:"儲存 PSD 與輸出 JPG／PNG", k:"Ctrl/Cmd+S", p:[36,37]},
  {id:"practice", t:"25 分鐘練習：FLOWER STUDY", p:[38]},
  {id:"keys", t:"常用快捷鍵", p:[39]},
 ]},
 {id:"hw", label:"回家作業", sub:"暖身練習 1・FLOWER STUDY", items:[
  {id:"hwbrief", t:"作業公告與規格", p:[40,49]},
  {id:"hw1", t:"01 建立文件與置入素材", p:[41]},
  {id:"hw2", t:"02 選取主體與修範圍", k:"Shift / Alt", p:[42]},
  {id:"hw3", t:"03 遮色片修整花瓣", p:[43]},
  {id:"hw4", t:"04 油漆桶白色背景", p:[44]},
  {id:"hw5", t:"05 灰色剪影", p:[45]},
  {id:"hw6", t:"06 變形與複製花影", p:[46]},
  {id:"hw7", t:"07 文字與前後層次", p:[47]},
  {id:"hw8", t:"08 繳交前檢查與輸出", p:[48]},
  {id:"downloads", t:"補充資料下載", p:[], dl:true},
 ]},
];
const DOWNLOADS = [
 {file:"downloads/flower-practice.png", name:"Photoshop_第一堂_花卉練習.png", title:"花卉練習照片", desc:"課堂與作業使用的素材照片。用「檔案 → 置入嵌入物件」放進 1080 × 1080 文件。", spec:"PNG・1536 × 1024 px", thumb:"downloads/flower-thumb.webp", pages:[5,15,25,26,38,41]},
 {file:"downloads/flower-study-example.jpg", name:"FLOWER_STUDY_作業範例.jpg", title:"FLOWER STUDY 作業範例", desc:"回家作業完成圖參考。版面配置可參考，學號與姓名請換成自己的。", spec:"JPG・1080 × 1080 px", thumb:"downloads/example-thumb.webp", pages:[38,40,47,48,49]},
];

const IMG = Array.from({length:49},(_,i)=>`slides/p-${String(i+1).padStart(2,"0")}.webp`);
const TH = Array.from({length:49},(_,i)=>`thumbs/p-${String(i+1).padStart(2,"0")}.webp`);
const ALL = [];
GROUPS.forEach(g=>g.items.forEach(it=>{it.g=g;ALL.push(it)}));
const byId = Object.fromEntries(ALL.map(i=>[i.id,i]));
const $ = s=>document.querySelector(s);
const nav=$("#nav"), view=$("#view"), main=$("#main"), side=$("#side");
const range = p=> !p.length ? "" : p.length>1 ? `第 ${p[0]}–${p[p.length-1]} 頁` : `第 ${p[0]} 頁`;
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildNav(){
  nav.innerHTML = GROUPS.map(g=>`<div class="grp" data-g="${g.id}">
    <div class="grp-h"><b>${esc(g.label)}</b><small>${esc(g.sub)}</small></div>
    ${g.items.map(it=>`<button class="item" type="button" data-id="${it.id}"><i class="dot"></i><span class="nm">${esc(it.t)}</span>${it.k?`<kbd>${esc(it.k)}</kbd>`:""}</button>`).join("")}
  </div>`).join("") + `<div class="empty" id="empty" hidden>找不到符合的功能，換個關鍵字試試。</div>`;
  nav.addEventListener("click",e=>{const b=e.target.closest(".item"); if(b) go(b.dataset.id)});
}
function filter(q){
  q=q.trim().toLowerCase(); let any=false;
  document.querySelectorAll(".grp").forEach(gEl=>{
    let vis=0;
    gEl.querySelectorAll(".item").forEach(b=>{
      const it=byId[b.dataset.id];
      const hay=(it.t+" "+(it.k||"")+" "+it.p.map(n=>PAGE_TITLES[n-1]).join(" ")+" "+it.g.label).toLowerCase();
      const ok=!q||hay.includes(q); b.hidden=!ok; if(ok)vis++;
    });
    gEl.hidden=!vis; if(vis)any=true;
  });
  $("#empty").hidden=any;
}
function card(it){
  if(it.dl) return `<button class="card" type="button" data-id="${it.id}"><img src="${DOWNLOADS[0].thumb}" alt="" loading="lazy"><div class="cb"><span class="ct">${esc(it.t)}</span><span class="cm"><span>${DOWNLOADS.length} 個檔案</span><span class="kbd">下載</span></span></div></button>`;
  return `<button class="card" type="button" data-id="${it.id}"><img src="${TH[it.p[0]-1]}" alt="" loading="lazy"><div class="cb"><span class="ct">${esc(it.t)}</span><span class="cm"><span>${range(it.p)}</span>${it.k?`<span class="kbd">${esc(it.k)}</span>`:""}</span></div></button>`;
}
function renderHome(){
  view.innerHTML = `<div class="hero"><div class="eyebrow">Adobe Photoshop ・ 多媒體設計</div>
    <h1>Photoshop 第一堂課：從像素、圖層到 FLOWER STUDY 海報</h1>
    <p>點選任一功能，直接看那一部分的教學投影片。左側目錄可隨時切換，也能用搜尋找工具名稱或快捷鍵。</p>
    <div class="how"><span>點投影片可放大</span><span>← → 鍵切換功能</span><span>共 ${PAGE_TITLES.length} 頁・${ALL.length} 個主題</span></div></div>
    ${GROUPS.map(g=>`<section class="sec"><div class="sec-h"><h2>${esc(g.label)}</h2><small>${esc(g.sub)}</small></div><div class="grid">${g.items.map(card).join("")}</div></section>`).join("")}`;
  view.querySelectorAll(".card").forEach(c=>c.onclick=()=>go(c.dataset.id));
  $("#tbTitle").textContent="Photoshop 第一堂課";
}
let cur=null;
function dlBox(list,head){
  if(!list.length) return "";
  return `<section class="dl"><h2>${esc(head)}</h2><div class="dl-grid">${list.map(d=>`<article class="dl-item"><img src="${d.thumb}" alt="" loading="lazy"><div class="dl-b"><b>${esc(d.title)}</b><p>${esc(d.desc)}</p><small>${esc(d.spec)}</small><a class="dl-btn" href="${encodeURI(d.file)}" download="${esc(d.name)}">下載檔案</a></div></article>`).join("")}</div></section>`;
}
function renderDownloads(it){
  const i=ALL.indexOf(it), prev=ALL[i-1];
  view.innerHTML = `<div class="eyebrow">${esc(it.g.label)}</div><h1>補充資料下載</h1>
    <div class="meta"><span>練習素材與作業範例・下載後在 Photoshop 開啟或置入</span></div>
    ${dlBox(DOWNLOADS,"檔案")}
    <p class="note">如果按了沒有下載、只開啟圖片，可在圖片上按右鍵選「另存圖片」。</p>
    <div class="pager"><button type="button" class="prev" ${prev?`data-id="${prev.id}"`:"disabled"}><small>← 上一個功能</small><b>${prev?esc(prev.t):""}</b></button><button type="button" class="next" disabled></button></div>`;
  view.querySelectorAll(".pager button[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  $("#tbTitle").textContent=it.t;
}
// 預先載入：同主題其他頁、下一個主題第一頁
const _pre=new Set();
function pre(n){ if(!n||_pre.has(n))return; _pre.add(n); const im=new Image(); im.decoding="async"; im.src=IMG[n-1]; }
function warm(it){
  const i=ALL.indexOf(it), next=ALL[i+1], prev=ALL[i-1];
  const run=()=>{ it.p.forEach(pre); if(next&&next.p[0])pre(next.p[0]); if(prev&&prev.p.length)pre(prev.p[prev.p.length-1]); };
  (window.requestIdleCallback||(f=>setTimeout(f,300)))(run);
}
nav.addEventListener("pointerover",e=>{const b=e.target.closest(".item"); if(b){const x=byId[b.dataset.id]; if(x&&x.p[0])pre(x.p[0]);}});

function renderTopic(it){
  if(it.dl) return renderDownloads(it);
  const i=ALL.indexOf(it), prev=ALL[i-1], next=ALL[i+1];
  const titles=[...new Set(it.p.map(n=>PAGE_TITLES[n-1]))];
  view.innerHTML = `<div class="eyebrow">${esc(it.g.label)}</div>
    <h1>${esc(it.t)}</h1>
    <div class="meta"><span>${range(it.p)}・共 ${it.p.length} 頁</span>${it.k?`<span>快捷鍵 <span class="kbd">${esc(it.k)}</span></span>`:""}</div>
    ${it.p.length>1?`<div class="chips">${it.p.map(n=>`<button class="chip" type="button" data-jump="${n}">${n}・${esc(PAGE_TITLES[n-1])}</button>`).join("")}</div>`:""}
    <div class="slides">${it.p.map(n=>`<figure id="s${n}"><button class="frame" type="button" data-p="${n}" aria-label="放大第 ${n} 頁"><img src="${IMG[n-1]}" alt="${esc(PAGE_TITLES[n-1])}" ${n===it.p[0]?"":'loading="lazy"'}></button><figcaption><span>${esc(PAGE_TITLES[n-1])}</span><span class="pg">${String(n).padStart(2,"0")} / ${PAGE_TITLES.length}</span></figcaption></figure>`).join("")}</div>
    ${dlBox(DOWNLOADS.filter(d=>d.pages.some(n=>it.p.includes(n))),"這個單元會用到的素材")}
    <div class="pager"><button type="button" class="prev" ${prev?`data-id="${prev.id}"`:"disabled"}><small>← 上一個功能</small><b>${prev?esc(prev.t):""}</b></button><button type="button" class="next" ${next?`data-id="${next.id}"`:"disabled"}><small>下一個功能 →</small><b>${next?esc(next.t):""}</b></button></div>`;
  view.querySelectorAll(".chip").forEach(c=>c.onclick=()=>document.getElementById("s"+c.dataset.jump).scrollIntoView({behavior:"smooth",block:"start"}));
  view.querySelectorAll(".frame").forEach(f=>f.onclick=()=>openLb(it,+f.dataset.p));
  view.querySelectorAll(".pager button[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  $("#tbTitle").textContent=it.t;
  warm(it);
}
function go(id,push=true){
  const it=byId[id];
  cur=it||null;
  if(it) renderTopic(it); else renderHome();
  document.querySelectorAll(".item").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id?"true":"false"));
  const act=nav.querySelector(`.item[data-id="${id}"]`); if(act) act.scrollIntoView({block:"nearest"});
  main.scrollTop=0; side.classList.remove("open");
  if(push){ try{ history.replaceState(null,"",it?"#"+id:location.pathname+location.search) }catch(e){} }
}
// Lightbox
let lbList=[], lbI=0;
function openLb(it,n){lbList=it.p; lbI=it.p.indexOf(n); showLb(); $("#lb").hidden=false}
function showLb(){const n=lbList[lbI]; $("#lbImg").src=IMG[n-1]; $("#lbCap").textContent=`${n}・${PAGE_TITLES[n-1]}`; $("#lbPrev").disabled=lbI===0; $("#lbNext").disabled=lbI===lbList.length-1}
$("#lbClose").onclick=()=>$("#lb").hidden=true;
$("#lb").onclick=e=>{if(e.target.id==="lb")$("#lb").hidden=true};
$("#lbPrev").onclick=()=>{if(lbI>0){lbI--;showLb()}};
$("#lbNext").onclick=()=>{if(lbI<lbList.length-1){lbI++;showLb()}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(!$("#lb").hidden){ if(e.key==="Escape")$("#lb").hidden=true; if(e.key==="ArrowLeft")$("#lbPrev").click(); if(e.key==="ArrowRight")$("#lbNext").click(); return;}
  const i=cur?ALL.indexOf(cur):-1;
  if(e.key==="ArrowRight"&&i<ALL.length-1)go(ALL[i+1].id);
  if(e.key==="ArrowLeft"){ if(i>0)go(ALL[i-1].id); else if(i===0)go(null);}
});
$("#q").addEventListener("input",e=>filter(e.target.value));
$("#home").onclick=()=>go(null);
$("#home").onkeydown=e=>{if(e.key==="Enter")go(null)};
$("#openSide").onclick=()=>side.classList.add("open");
$("#closeSide").onclick=()=>side.classList.remove("open");
buildNav();
const h=(location.hash||"").slice(1);
go(byId[h]?h:null,false);
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1); if((byId[k]||null)!==cur) go(byId[k]?k:null,false);});
</script>

</body></html>
